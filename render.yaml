# Render Blueprint: one free web service that serves the website AND runs
# the live game. In the Render dashboard choose New → Blueprint, pick this
# repository, and fill in the three secrets.
services:
  - type: web
    name: ctrl-alt-steal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: VOLUNTEER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
# Optional: if you also host the website on Vercel, add ALLOWED_ORIGINS with
# your Vercel address in the service's Environment tab.
